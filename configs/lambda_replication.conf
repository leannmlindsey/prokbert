# Lambda phage replication config.
#
# Sourced by:
#   slurm_scripts/lambda_replication/run_lambda_training.sh
#   slurm_scripts/lambda_replication/run_lambda_inference.sh
#
# Edit the REQUIRED paths below, then run training, wait for jobs to finish
# (`squeue -u $USER`), then run inference. See README "Path 2".

# --- REQUIRED -----------------------------------------------------------------

# Directory containing train.csv, dev.csv (or val.csv), test.csv.
export LAMBDA_DIR="/path/to/lambda"

# Replication output root. Everything is written under here.
#   <OUTPUT_DIR>/finetune/<arch>/seed-<N>/    test_results.json + best_model/
#   <OUTPUT_DIR>/embedding/<arch>/            embedding_analysis_results.json
#   <OUTPUT_DIR>/winners.json                 picked by run_lambda_inference.sh
#   <OUTPUT_DIR>/inference/<arch>/<set>_predictions.csv
#   <OUTPUT_DIR>/genome_wide_analysis/<arch>/ threshold + clustering sweep
#   <OUTPUT_DIR>/logs/                        SLURM stdout/stderr
export OUTPUT_DIR="/path/to/output"

# Diagnostic test CSVs (each must have `sequence` and `label` columns).
# DIAGNOSTIC_DATASETS is a colon-separated list of name=path entries.
# The `name` becomes the predictions filename prefix.
export DIAGNOSTIC_DATASETS="test=/path/to/test.csv:gc_control=/path/to/gc.csv:fpr=/path/to/fpr.csv:fnr=/path/to/fnr.csv"

# Genome-wide CSV for threshold + clustering sweep (windowed predictions).
export GENOME_WIDE_CSV="/path/to/genome_wide.csv"

# --- OPTIONAL -----------------------------------------------------------------

# Space-separated lists.
export ARCHS="prokbert-mini prokbert-mini-c prokbert-mini-long"
export SEEDS="1 2 3"

# Finetune hyperparameters.
export LR="1e-4"
export BATCH_SIZE="32"
export NUM_EPOCHS="3"
export EARLY_STOPPING_PATIENCE="3"
export USE_FP16="1"

# Embedding analysis hyperparameters.
export POOLING="mean"           # mean | max | cls
export NN_EPOCHS="100"
export NN_LR="0.001"

# SLURM resources. Adjust if your dataset is unusually large/small.
export FT_MEM="32g"
export FT_TIME="24:00:00"
export EMB_MEM="64g"
export EMB_TIME="4:00:00"
export INF_MEM="32g"
export INF_TIME="2:00:00"
export GA_MEM="16g"
export GA_TIME="2:00:00"
export GA_PARTITION="norm"      # genome analysis is CPU-only
