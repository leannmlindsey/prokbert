# Lambda phage replication config.
#
# Sourced by:
#   slurm_scripts/lambda_replication/run_lambda_training.sh
#   slurm_scripts/lambda_replication/run_lambda_inference.sh
#
# Edit the REQUIRED paths below, then:
#   1. bash slurm_scripts/lambda_replication/run_lambda_training.sh
#   2. wait for jobs to finish (squeue -u $USER)
#   3. bash slurm_scripts/lambda_replication/run_lambda_inference.sh
#
# The pipeline loops over SEGMENT_LENGTHS. For each length it runs:
# finetune × N seeds, embedding analysis × 3 architectures, best-model
# selection by test-set MCC, then inference on the matching-length
# diagnostic and (optional) genome-wide CSVs. Outputs are per-length.

# --- REQUIRED -----------------------------------------------------------------

# LAMBDA_v1 dataset root. Expected structure (LAMBDA_v1 layout):
#   $LAMBDA_BASE/train_val_test/<LEN>/{train,val,test}.csv     mixed phage+bacteria
#   $LAMBDA_BASE/fpr_test/<LEN>/bacteria_segments_<LEN>.csv    bacteria-only (FPR control)
#   $LAMBDA_BASE/shuffled_controls/<LEN>/test_shuffled.csv     GC-preserving shuffled control
export LAMBDA_BASE="/path/to/LAMBDA_v1"

# Replication output root. Per-length results land under here:
#   $OUTPUT_DIR/<LEN>/finetune/<arch>/seed-<N>/   test_results.json + best_model/
#   $OUTPUT_DIR/<LEN>/embedding/<arch>/           embedding_analysis_results.json
#   $OUTPUT_DIR/<LEN>/winners.json                picked by run_lambda_inference.sh
#   $OUTPUT_DIR/<LEN>/inference/<arch>/           <dataset>_predictions.csv
#   $OUTPUT_DIR/<LEN>/genome_wide_analysis/<arch>/   threshold + clustering sweep
#   $OUTPUT_DIR/logs/                             SLURM stdout/stderr (shared)
export OUTPUT_DIR="/path/to/output"

# Sequence lengths to run. Each becomes a separate output subdirectory.
# Set to a single value (e.g. "2k") to run only one length.
export SEGMENT_LENGTHS="2k 4k 8k"

# --- OPTIONAL: diagnostics NOT in LAMBDA_v1 ----------------------------------

# FNR (false negative rate) test sets — phage-only sequences. Per-length CSV.
# Variable name is FNR_<LEN> where <LEN> matches an entry in SEGMENT_LENGTHS.
# Leave empty to skip the FNR diagnostic for that length.
export FNR_2k="/home/lindseylm/lindseylm/lambda_final/phage_only_annotations/segments/phage_segments_2k_1k.csv"
export FNR_4k="/home/lindseylm/lindseylm/lambda_final/phage_only_annotations/segments/phage_segments_4k_2k.csv"
export FNR_8k="/home/lindseylm/lindseylm/lambda_final/phage_only_annotations/segments/phage_segments_8k_4k.csv"

# Genome-wide inputs — per-length. Each is either:
#   - a CSV file (one input → one inference job per arch), or
#   - a directory containing *.csv files (one inference job per CSV per arch,
#     then a single genome-wide analysis job aggregates them).
# Leave empty to skip genome-wide stages for that length.
export GENOME_WIDE_2k="/home/lindseylm/lindseylm/lambda_final/phoenix/segments/2k_1k"
export GENOME_WIDE_4k="/home/lindseylm/lindseylm/lambda_final/phoenix/segments/4k_2k"
export GENOME_WIDE_8k="/home/lindseylm/lindseylm/lambda_final/phoenix/segments/8k_4k"

# --- OPTIONAL: training hyperparameters --------------------------------------

# ProkBERT architectures to evaluate.
export ARCHS="prokbert-mini prokbert-mini-c prokbert-mini-long"

# Random seeds for finetuning (one finetune job per arch per seed).
# Linear probe + 3-layer NN always run with seed 42.
export SEEDS="1 2 3 4 5"

# Finetune hyperparameters.
export LR="1e-4"
export BATCH_SIZE="32"
export NUM_EPOCHS="3"
export EARLY_STOPPING_PATIENCE="3"
export USE_FP16="1"

# Embedding analysis hyperparameters.
export POOLING="mean"           # mean | max | cls
export NN_EPOCHS="100"
export NN_LR="0.001"

# --- OPTIONAL: SLURM resources -----------------------------------------------

export FT_MEM="32g"
export FT_TIME="24:00:00"
export EMB_MEM="64g"
export EMB_TIME="4:00:00"
export INF_MEM="32g"
export INF_TIME="2:00:00"
export GA_MEM="16g"
export GA_TIME="2:00:00"
export GA_PARTITION="norm"      # genome analysis is CPU-only
